<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPERTEAM CLOTHING - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at 50% 30%, #17042b 0%, #031409 50%, #020704 100%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            padding: 15px;
        }

        .main-container {
            display: flex;
            flex-direction: row; /* Laging nasa left ang image kahit sa phone */
            align-items: center;
            justify-content: center;
            gap: 40px;
            width: 100%;
            max-width: 900px;
            padding: 35px;
            background: linear-gradient(135deg, rgba(22, 5, 42, 0.85) 0%, rgba(4, 25, 14, 0.9) 100%);
            border: 1px solid rgba(0, 255, 136, 0.35);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 25px rgba(0, 255, 136, 0.15), 0 0 40px rgba(168, 85, 247, 0.15);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            
        }

        /* LEFT SIDE: BRAND LOGO */
        .brand-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            align-self: stretch;
            min-height: 420px;
        }
        .logo-box {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 380px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            box-shadow: none;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .logo-box:hover {
            transform: scale(1.02);
            border: none;
            box-shadow: none;
        }
        .brand-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            display: block;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        /* ENLARGED: sakop buong extra spaces sa left side */
        .logo-default {
            transform: translate(-50%, -50%) scale(1.18);
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            opacity: 1;
            z-index: 1;
            filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.85));
        }
        /* CURRENT SIZE: panatilihin ang current size nito */
        .logo-hover {
            transform: translate(-50%, -50%);
            max-width: 270px;
            max-height: 270px;
            width: auto;
            height: auto;
            object-fit: contain;
            opacity: 0;
            z-index: 2;
            filter: drop-shadow(0 15px 35px rgba(0, 0, 0, 0.9)) drop-shadow(0 0 20px rgba(0, 255, 136, 0.3));
        }
        .logo-box:hover .logo-default {
            opacity: 0;
        }
        .logo-box:hover .logo-hover {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.03);
        }

        /* RIGHT SIDE: LOGIN FORM & FIELDSET */
        .form-section {
            flex: 1.1;
            display: flex;
            justify-content: center;
            width: 100%;
            min-width: 0;
        }
        form {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .login-title {
            font-family: Georgia, 'Times New Roman', Times, serif;
            color: #00ff88;
            font-size: 42px;
            margin: 0;
            padding: 0;
            line-height: 1;
            text-align: center;
            text-shadow: 0 0 12px rgba(0, 255, 136, 0.7), 0 0 25px rgba(168, 85, 247, 0.5);
            transition: font-size 0.3s ease;
        }
        .brandname {
            font-size: 32px;
            font-family: Georgia, 'Times New Roman', Times, serif;
            letter-spacing: 4px;
            margin: 0 0 12px 0;
            padding: 0;
            line-height: 1;
            background: linear-gradient(90deg, #c084fc 0%, #00ff88 50%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(0, 255, 136, 0.4));
            text-align: center;
            transition: font-size 0.3s ease;
        }
        fieldset {
            border: 2px solid #00ff88;
            border-radius: 14px;
            padding: 20px;         width: 100%;
            margin: 0;
            background: linear-gradient(145deg, rgba(20, 6, 38, 0.95) 0%, rgba(3, 22, 12, 0.95) 100%);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.85), inset 0 0 15px rgba(0, 255, 136, 0.08), 0 0 15px rgba(0, 255, 136, 0.2);
            transition: padding 0.3s ease;
        }
        legend {
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            color: #00ff88;
            background: linear-gradient(90deg, #2a0b50, #042514);
            padding: 5px 16px;
            border-radius: 6px;
            border: 1px solid #00ff88;
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.4);
            letter-spacing: 1px;
            font-family: Arial, Helvetica, sans-serif;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.9);
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            text-align: center;
            color: #bbf7d0;
            text-shadow: 0 0 6px rgba(0, 0, 0, 0.9);
            font-size: 13px;
        }
        input[type="text"], input[type="password"], input[type="email"], input[type="tel"] {
            background-color: rgba(15, 5, 28, 0.85);
            border: 1px solid rgba(0, 255, 136, 0.25);
            border-bottom: 2px solid #a855f7;
            border-radius: 6px;
            margin-top: 4px;
            font-weight: normal;
            color: #e6ffed;
            padding: 8px 12px;
            width: 100%;
            transition: all 0.2s ease;
        }
        input::placeholder {
            color: #6b7280;
        }
        input:focus {
            outline: none;
            border-bottom: 2px solid #00ff88;
            background-color: rgba(24, 7, 44, 0.95);
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.5);
        }
        .submit {
            background: linear-gradient(135deg, #00ff88 0%, #10b981 35%, #9333ea 100%);
            color: #040906;
            padding: 10px 24px;
            border: 1px solid #34d399;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 16px;
            display: block;
            margin-left: auto;
            margin-right: auto;
            font-weight: 900;
            letter-spacing: 1.5px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-size: 13px;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
            width: 100%;
        }
        .submit:hover {
            background: linear-gradient(135deg, #34d399 0%, #00ff88 35%, #a855f7 100%);
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.8), 0 0 35px rgba(168, 85, 247, 0.5);
            transform: translateY(-2px);
        }
        .terms-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 14px;
            margin-bottom: 5px;
        }
        .terms-container input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #00ff88;
            cursor: pointer;
            margin: 0;
        }
        .terms-label {
            display: inline !important;
            margin: 0 !important;
            font-size: 13px;
            color: #d1d5db;
            cursor: pointer;
            font-weight: normal !important;
            text-align: left !important;
        }
        .terms-link {
            color: #00ff88;
            text-decoration: underline;
        }
        .terms-link:hover {
            color: #c084fc;
            text-shadow: 0 0 8px rgba(192, 132, 252, 0.8);
        }
        .create-account-box {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            color: #9ca3af;
        }
        .create-account-link {
            color: #00ff88;
            font-weight: bold;
            text-decoration: none;
            margin-left: 5px;
            border-bottom: 1px dashed #00ff88;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .create-account-link:hover {
            color: #c084fc;
            border-bottom: 1px solid #c084fc;
            text-shadow: 0 0 8px rgba(192, 132, 252, 0.8);
        }
        span {
            color: #9ca3af;
            font-size: 13px;
        }

        /* AUTO ADJUST / RESPONSIVE FOR TABLET (768px pababa) */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: row; /* Tiyak na nasa left pa rin ang image */
                gap: 20px;
                padding: 20px 15px;
                width: 96%;
            }
            .brand-section {
                flex: 0 0 42%;
                max-width: 250px;
                min-height: 340px;
            }
            .logo-box {
                min-height: 320px;
                border: none;
                box-shadow: none;
                background: transparent;
            }
            .logo-default {
                transform: translate(-50%, -50%) scale(1.15);
            }
            .logo-hover {
                max-width: 210px;
                max-height: 210px;
            }
            .login-title {
                font-size: 30px;
            }
            .brandname {
                font-size: 22px;
                letter-spacing: 3px;
            }
            fieldset {
                padding: 16px 12px;
            }
            input[type="text"], input[type="password"], input[type="email"], input[type="tel"] {
                padding: 7px 10px;
                font-size: 12px;
            }
            label {
                font-size: 12px;
                margin-top: 8px;
            }
            .submit {
                padding: 8px 16px;
                font-size: 12px;
            }
        }

        /* AUTO ADJUST / RESPONSIVE FOR PHONE (480px pababa) */
        @media (max-width: 480px) {
            body {
                padding: 8px;
            }
            .main-container {
                flex-direction: row; /* NASA LEFTSIDE PA RIN ANG IMAGE KAHIT SA PHONE */
                gap: 10px;
                padding: 12px 8px;
                width: 100%;
                border-radius: 12px;
            }
            .brand-section {
                flex: 0 0 38%;
                max-width: 140px;
                min-height: 260px;
            }
            .logo-box {
                min-height: 240px;
                border: none;
                box-shadow: none;
                background: transparent;
            }
            .logo-default {
                transform: translate(-50%, -50%) scale(1.18);
            }
            .logo-hover {
                max-width: 110px;
                max-height: 110px;
            }
            .form-section {
                flex: 1;
                min-width: 0;
            }
            .login-title {
                font-size: 19px;
            }
            .brandname {
                font-size: 15px;
                letter-spacing: 2px;
                margin-bottom: 6px;
            }
            fieldset {
                padding: 10px 8px;
                border-radius: 10px;
                border-width: 1.5px;
            }
            legend {
                font-size: 11px;
                padding: 2px 8px;
            }
            label {
                font-size: 10px;
                margin-top: 5px;
            }
            input[type="text"], input[type="password"], input[type="email"], input[type="tel"] {
                padding: 5px 6px;
                font-size: 11px;
                margin-top: 2px;
            }
            .submit {
                padding: 6px 10px;
                font-size: 11px;
                margin-top: 10px;
                border-radius: 15px;
            }
            .terms-container {
                gap: 4px;
                margin-top: 8px;
                margin-bottom: 3px;
            }
            .terms-container input[type="checkbox"] {
                width: 12px;
                height: 12px;
            }
            .terms-label {
                font-size: 9px !important;
            }
            .create-account-box {
                font-size: 10px;
                margin-top: 8px;
            }
            .create-account-link {
                font-size: 10px;
            }
            span {
                font-size: 10px;
            }
        }

    </style>
</head>
<body>

<div class="main-container">
    <!-- LEFT SIDE: LOGO WITH HOVER EFFECT -->
    <div class="brand-section">
        <a href="index.html" class="logo-box" title="Back to Home">
            <img src="superteam_logo.jpg" alt="SUPERTEAM Logo" class="brand-logo logo-default">
            <img src="superteam_hover.jpg" alt="SUPERTEAM Hover Logo" class="brand-logo logo-hover">
        </a>
</div>

    <!-- RIGHT SIDE: LOGIN FORM & FIELDSET -->
    <div class="form-section">
        <form id="login-form">
            <h2 class="login-title">SUPERTEAM</h2>
            <h1 class="brandname">CLOTHING</h1>
            <fieldset>
                <legend>Login</legend>

                <label for="name">Name:</label> 
                <input type="text" id="name" name="name" placeholder="Enter your name">
                <br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email">
                <br>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter your password">
                <br>
                <label for="phone">Phone:</label>
                <input type="text" id="phone" name="phone" placeholder="Enter your phone number">
                <br>

                <div class="terms-container">
                    <input type="checkbox" id="terms" name="terms">
                    <label for="terms" class="terms-label">I agree to the <a href="#" class="terms-link">Terms & Conditions</a></label>
                </div>

                <button class="submit" type="submit">Login</button>

                <div class="create-account-box">
                    <span>Don't have an account?</span>
                    <a href="register.html" class="create-account-link">Register</a>
                </div>

                <p id="output"></p>
            </fieldset>
        </form>
    </div>
</div>

<script>
    const form = document.getElementById('login-form');
    form.addEventListener('submit', function(event) {
        event.preventDefault();

        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const phone = document.getElementById('phone').value.trim();
        const terms = document.getElementById('terms');

        if (!name || !email || !password || !phone) {
            alert('buseng Kulang tanga.');
            return;
        }

        if (!terms.checked) {
            alert('Paki-check muna ang Agree to Terms.');
            return;
        }

        alert('Login Successful! Welcome to SUPERTEAM CLOTHING!');
    });
</script>
</body>
</html>
